name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: siAMWHzKaIZkf1wTLax3
          KEY_PASSWORD: siAMWHzKaIZkf1wTLax3
          KEY_ALIAS: jogkhela
        run: |
          echo "::notice::step1 start, ANDROID_HOME=$ANDROID_HOME"
          openssl enc -d -aes-256-cbc -pbkdf2 -in release.jks.enc -out $RUNNER_TEMP/release.jks -pass env:KEYSTORE_PASSWORD 2>err.txt || { echo "::error::openssl: $(cat err.txt)"; exit 1; }
          echo "::notice::keystore ok"
          export KEYSTORE_FILE=$RUNNER_TEMP/release.jks
          gradle assembleRelease bundleRelease --stacktrace > build.log 2>&1 || {
            grep -E "error:|Error|FAILED|What went wrong|issue was found" -A12 build.log | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            tail -15 build.log | while IFS= read -r l; do echo "::error::TAIL $l"; done
            exit 1; }
          echo "::notice::gradle ok"
      - uses: actions/upload-artifact@v4
        with:
          name: jog-khela-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
