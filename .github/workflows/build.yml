name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: siAMWHzKaIZkf1wTLax3
          KEY_PASSWORD: siAMWHzKaIZkf1wTLax3
          KEY_ALIAS: jogkhela
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in release.jks.enc -out $RUNNER_TEMP/release.jks -pass env:KEYSTORE_PASSWORD
          export KEYSTORE_FILE=$RUNNER_TEMP/release.jks
          set -o pipefail
          gradle assembleRelease bundleRelease --stacktrace 2>&1 | tee build.log || {
            grep -E "error|Error|FAILED|What went wrong|wrong:" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: jog-khela-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
